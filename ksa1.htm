
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSA</title>
<style>
body {
    margin: 0;
    background: #03140c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}
main {
    position: relative;
    z-index: 1;
    padding: 20vh 15px 0;
}
h1 {
    color: #43ff80;
    font-size: 80px;
    text-shadow: 0 0 25px #00ff66;
}
p {
    font-size: 28px;
    animation: glow 2s infinite alternate;
}
button {
    padding: 14px 25px;
    border-radius: 25px;
    border: 1px solid #43ff80;
    background: #064421;
    color: white;
    font-size: 18px;
}
@keyframes glow {
    from { opacity: .5; }
    to { opacity: 1; }
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<main>
    <h1>KSA</h1>
    <p id="message">جنة جنة جنة 🇸🇦</p>
    <button onclick="next()">ابدأ العرض</button>
</main>
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
let drops = [];
function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    drops = Array(Math.ceil(innerWidth / 18)).fill(0);
}
resize();
window.addEventListener("resize", resize);
setInterval(() => {
    ctx.fillStyle = "rgba(3,20,12,.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#43ff80";
    ctx.font = "15px monospace";
    drops.forEach((y,i) => {
        ctx.fillText(Math.random() > .5 ? "1" : "0",i*18,y*18);
        drops[i] = y*18 > canvas.height && Math.random() > .97 ? 0 : y+1;
    });
},50);

const lines = [
    "جنة جنة جنة",
    "والله يا وطنا",
    "يا وطن يا حبيب",
    "يا أبو تراب طيب",
    "حتى نارك جنة",
    "حتى نارك جنة",
    "جنة جنة جنة",
    "والله يا السعودية جنة 🇸🇦"
];
let i = 0;
function next() {
    document.getElementById("message").textContent = lines[i];
    i = (i+1) % lines.length;
}
</script>
</body>
</html>
