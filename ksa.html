
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSA | وطن المجد</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#020b08;color:white;
font-family:Tahoma,Arial,sans-serif;
overflow:hidden;min-height:100vh
}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{
position:relative;z-index:1;min-height:100vh;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
text-align:center;padding:20px
}
.tag{color:#aaffbd;letter-spacing:5px;font-size:12px}
h1{
font-size:clamp(70px,18vw,130px);
color:#65ff91;margin:20px 0 0;
text-shadow:0 0 20px #00ff66,0 0 60px #00ff66;
animation:intro 2s ease
}
.sub{color:#e8d59a;letter-spacing:3px}
#lyric{
margin-top:35px;min-height:90px;
font-size:clamp(24px,6vw,42px);
font-weight:bold;color:white;
text-shadow:0 0 20px #39ff78;
opacity:0;transform:translateY(20px);
transition:1s
}
#lyric.show{opacity:1;transform:translateY(0)}
#lyric.gold{color:#ffe7a3;text-shadow:0 0 25px #ffc94d}
button{
margin-top:20px;padding:13px 27px;
border:1px solid #65ff91;border-radius:30px;
background:#073a20;color:white;font-size:16px;
cursor:pointer
}
button:hover{box-shadow:0 0 25px #00ff66}
footer{
position:absolute;bottom:20px;
font-size:11px;letter-spacing:3px;color:#75a989
}
@keyframes intro{
from{opacity:0;transform:scale(1.5);filter:blur(10px)}
to{opacity:1;transform:scale(1);filter:blur(0)}
}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<main>
<div class="tag">A CINEMATIC TRIBUTE</div>
<h1>KSA</h1>
<div class="sub">المملكة العربية السعودية 🇸🇦</div>
<div id="lyric">حكاية وطن...</div>
<button onclick="start()">▶ ابدأ النهاية</button>
<footer>MADE WITH PRIDE · SAUDI ARABIA</footer>
</main>
<script>
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
let drops=[];
function resize(){
c.width=innerWidth;c.height=innerHeight;
drops=Array(Math.ceil(c.width/18)).fill(0);
}
resize();
window.addEventListener("resize",resize);
setInterval(()=>{
ctx.fillStyle="rgba(2,11,8,.13)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#28ff75";
ctx.font="15px monospace";
const chars="101010{}[]<>KSA";
drops.forEach((y,i)=>{
ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*18,y*18);
drops[i]=y*18>c.height&&Math.random()>.97?0:y+1;
});
},45);

const words=[
"جنة جنة جنة",
"والله يا وطنا",
"يا وطن يا حبيب",
"يا أبو تراب طيب",
"حتى نارك جنة",
"حتى نارك جنة",
"جنة جنة جنة",
"والله يا السعودية جنة"
];
let timer;
function start(){
clearInterval(timer);
let i=0;
const el=document.getElementById("lyric");
el.className="";
el.textContent="استعدوا للنهاية...";
setTimeout(()=>{
el.classList.add("show");
timer=setInterval(()=>{
if(i>=words.length){
clearInterval(timer);
el.className="gold show";
el.textContent="السعودية... عز وفخر 🇸🇦";
return;
}
el.className=""; 
setTimeout(()=>{
el.textContent=words[i];
el.className="show"+(i===7?" gold":"");
i++;
},350);
},2200);
},500);
}
</script>
</body>
</html>
